org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental compilation stores paths relative to the project root.
# On Windows, this fails when the project (E:) and Pub cache (C:) are on different drives.
kotlin.incremental=false
android.builtInKotlin=false
android.newDsl=false

# Used by Flutter's dependency checker when KGP is not in settings.gradle.
kotlin_version=2.2.20
