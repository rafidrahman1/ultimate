name: personal
description: "A personal app."
publish_to: 'none'

version: 2.2.1+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  health: ^13.3.1
  permission_handler: ^11.3.1
  flutter_riverpod: ^2.5.1
  file_picker: ^8.1.7
  csv: ^6.0.0
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  dir_picker: ^0.4.1
  uri_content: ^3.1.3
  refresh_rate: ^1.0.1
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  package_info_plus: ^9.0.1
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Calendar_background.png
    - assets/Expenses_background.png
    - assets/GameActivity_background.png
    - assets/Health_background.png
    - assets/Location_background.png
