name: motohealth
description: "Track everything about your motorcycle."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  refresh_rate: ^1.0.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
