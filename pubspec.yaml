name: personal
description: "A personal app."
publish_to: 'none'

version: 2.2.1+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  health: ^13.3.1
  permission_handler: ^11.3.1
  flutter_riverpod: ^2.5.1
  file_picker: ^8.1.7
  csv: ^6.0.0
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  dir_picker: ^0.4.1
